<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="title" content="Create A New Rider Account">
    <meta name="description" content="Create a new driver account and start offering your driving services.">
    <link rel="stylesheet" href="style.css">
    <title>Create A New Rider Account</title>
</head>
<body>
<h1 id="create_new_rider_account">Rider Registration</h1>
<form action="/registerrider" method="POST">
    <h2 class="formheading">Create A New Rider Account</h2>
    <p>All fields are required.</p>

    <label for="username">Username</label>
    <input type="text" id="username" name="username">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
    <label for="firstname">First Name</label>
    <input type="text" id="firstname" name="firstname" required>
    <label for="lastname">Last Name</label>
    <input type="text" id="lastname" name="lastname" required>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
    <label for="city">City</label>
    <input type="text" id="city" name="city" required>
    <label for="country">Country</label>
    <input type="text" id="country" name="country" required>
    <label for="phone">Phone</label>
    <input type="number" id="phone" name="phone" required>
    <br>
    <button type="submit">Submit</button>
</form>
</body>
</html>
